[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seisvtk"
version = "0.0.1"
description = "3D seismic visualization with VTK"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aashrit", email = "abagareddy@quanticoenergy.com" }]

dependencies = [
    "numpy",
    "vtk",
    "torch",
    "segyio",
]

[tool.setuptools.packages.find]
where = ["src"]


